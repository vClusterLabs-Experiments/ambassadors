name: Approve ambassador contribution

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: approve-contribution-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - id: command
        name: Detect approval command
        uses: actions/github-script@v8
        with:
          script: return context.payload.comment.body.trimStart().startsWith('/approve')

      - uses: actions/checkout@v6
        if: steps.command.outputs.result == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v6
        if: steps.command.outputs.result == 'true'
        with:
          node-version: 22
      - if: steps.command.outputs.result == 'true'
        run: npm ci

      - id: approval
        name: Verify human approval and prepare record
        if: steps.command.outputs.result == 'true'
        run: node scripts/record-approval.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      # Pull requests opened with github.token do not trigger validate-data.yml, so the
      # record is validated here instead of merging unchecked.
      - name: Validate the prepared record
        if: steps.approval.outputs.approved == 'true'
        run: npm run validate:data

      - name: Explain rejected approval
        if: steps.approval.outputs.approved == 'false'
        uses: actions/github-script@v8
        env:
          COMMENT_BODY: ${{ steps.approval.outputs.comment_body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.COMMENT_BODY,
            })

      - id: pull-request
        name: Open contribution record pull request
        if: steps.approval.outputs.approved == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ${{ steps.approval.outputs.branch }}
          delete-branch: true
          add-paths: contributions/contributions.yml
          commit-message: ${{ steps.approval.outputs.pr_title }}
          title: ${{ steps.approval.outputs.pr_title }}
          body: ${{ steps.approval.outputs.pr_body }}
          labels: contribution-record,status:approved

      - name: Link pull request from issue
        if: steps.approval.outputs.approved == 'true' && steps.pull-request.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          RECORD_ID: ${{ steps.approval.outputs.record_id }}
        with:
          script: |
            const labels = context.payload.issue.labels
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter((label) => !label.startsWith('status:'))
            labels.push('status:pr-open')
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels,
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- ambassador-approval -->\nApproved contribution \`${process.env.RECORD_ID}\` has been prepared in #${process.env.PR_NUMBER}. The record becomes final when that pull request is merged.`,
            })

      - name: Report a failed approval run
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- ambassador-approval -->\nThe approval workflow failed before a contribution record could be prepared. A maintainer can inspect the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) and comment \`/approve\` again.`,
            })
