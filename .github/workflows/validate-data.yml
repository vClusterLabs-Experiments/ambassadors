name: Validate contribution data

on:
  pull_request:
    paths:
      - .github/workflows/validate-data.yml
      - ambassadors/**
      - config/**
      - contributions/**
      - ui/**
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-data.yml
      - ambassadors/**
      - config/**
      - contributions/**
      - ui/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Resolve missing GitHub user IDs
        run: node scripts/sync-identities.mjs --missing-only --strict
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - run: npm run verify:pages
