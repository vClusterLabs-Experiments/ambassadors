name: Validate contribution data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validate-data.yml
      - ambassadors/**
      - config/**
      - contributions/**
      - ui/**
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-data.yml
      - ambassadors/**
      - config/**
      - contributions/**
      - ui/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Resolve missing GitHub user IDs
        run: node scripts/sync-identities.mjs --missing-only --strict
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - run: npm run verify:pages

  persist-identities:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: persist-ambassador-identities
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Resolve missing GitHub user IDs
        run: node scripts/sync-identities.mjs --missing-only --strict
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run validate:data
      - run: npm test
      - name: Commit resolved IDs to main
        working-directory: .
        run: |
          if git diff --quiet -- ambassadors/ambassadors.yml; then
            echo "No missing GitHub IDs to save."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ambassadors/ambassadors.yml
          git commit -m "Save automatically resolved ambassador GitHub IDs"
          git push origin HEAD:main
