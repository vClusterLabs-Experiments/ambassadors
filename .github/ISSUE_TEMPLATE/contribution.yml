name: Ambassador contribution
description: Submit completed ambassador activity for maintainer review.
title: "[Contribution]: "
labels:
  - submission:ambassador
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the vCluster community. Automation validates this submission, but only an authorized maintainer can decide and approve points.

        Enter only your current GitHub username below. Validation resolves it through the GitHub API and matches it to the immutable numeric ID already recorded by a program maintainer.

  - type: input
    id: github_username
    attributes:
      label: Ambassador GitHub username
      description: Enter your current username as registered with the ambassador program, without the @ symbol. Do not enter a numeric GitHub ID.
      placeholder: hrittikhere
    validations:
      required: true

  - type: dropdown
    id: contribution_type
    attributes:
      label: Contribution type
      description: Select the type that best matches the completed contribution.
      options:
        - Social thread
        - Community help in Slack
        - Blog post
        - Short technical video
        - Tutorial
        - Meetup talk
        - Podcast guest
        - Livestream
        - Organizing a meetup
        - Conference talk
        - Workshop
        - Course
        - Project contribution
    validations:
      required: true

  - type: input
    id: completion_date
    attributes:
      label: Completion or publication date
      description: Use YYYY-MM-DD.
      placeholder: "2026-08-20"
    validations:
      required: true

  - type: input
    id: evidence_url
    attributes:
      label: Evidence URL
      description: Provide a public HTTPS URL that a reviewer can open.
      placeholder: https://www.cncf.io/blog/example-post/
    validations:
      required: true

  - type: textarea
    id: contribution_summary
    attributes:
      label: Contribution summary
      description: Explain what you completed and who it was for.
    validations:
      required: true
